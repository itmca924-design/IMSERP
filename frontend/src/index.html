  <link id="app-manifest" rel="manifest" href="manifest.webmanifest">
  <link id="app-apple-touch-icon" rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link id="app-favicon" rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Great+Vibes&family=Dancing+Script:wght@600;700&family=Alex+Brush&family=Caveat:wght@600;700&family=Sacramento&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/fonts/material-icons.woff2" as="font" type="font/woff2" crossorigin>
  <script src="assets/env.js"></script>
  <script>
    // Safeguard against third-party translation script errors (e.g. Google Translate reading 'link')
    window.addEventListener('error', function(e) {
      if (e && e.message && (e.message.indexOf('link') !== -1 || e.message.indexOf('reading') !== -1)) {
        if (!e.filename || e.filename.indexOf('translate') !== -1 || e.filename.indexOf('m=el_main') !== -1 || e.filename.indexOf('element.js') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }
    }, true);

    // Ensure clean boot in English: wipe any existing googtrans cookie before Google Translate script initializes
    (function() {
      try {
        var h = window.location.hostname;
        var past = "Thu, 01 Jan 1970 00:00:00 GMT; path=/";
        document.cookie = "googtrans=; expires=" + past;
        document.cookie = "googtrans=; expires=" + past + "; domain=" + h;
        document.cookie = "googtrans=; expires=" + past + "; domain=." + h;
        document.cookie = "googtrans=/en/en; path=/";
      } catch(e) {}
    })();
  </script>
</head>
<body class="mat-typography mat-app-background">
  <app-root></app-root>
  <div id="google_translate_element" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;"></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'hi,en',
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" defer></script>
</body>
</html>
