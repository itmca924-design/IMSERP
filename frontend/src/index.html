  <script>
    (function() {
      function recoverFromChunkOrScriptError(e) {
        try {
          var target = e && e.target;
          var isResource = target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK');
          var msg = (e && (e.message || (e.error && e.error.message) || (e.reason && e.reason.message))) ? String(e.message || e.error.message || e.reason.message).toLowerCase() : '';
          var isChunkError = isResource ||
            msg.indexOf('failed to fetch') !== -1 ||
            msg.indexOf('dynamically imported module') !== -1 ||
            msg.indexOf('loading chunk') !== -1 ||
            msg.indexOf('module script') !== -1;

          if (isChunkError) {
            var lastReload = Number(sessionStorage.getItem('chunk_reload_timestamp') || '0');
            var now = Date.now();
            if (now - lastReload > 8000) {
              sessionStorage.setItem('chunk_reload_timestamp', String(now));
              if (typeof caches !== 'undefined') {
                caches.keys().then(function(names) {
                  return Promise.all(names.map(function(n) { return caches.delete(n); }));
                }).finally(function() {
                  window.location.reload();
                });
              } else {
                window.location.reload();
              }
            }
          }
        } catch(err) {}
      }
      window.addEventListener('error', recoverFromChunkOrScriptError, true);
      window.addEventListener('unhandledrejection', recoverFromChunkOrScriptError);
    })();
  </script>
  <script>
    (function() {
      try {
        var user = null;
        var raw = localStorage.getItem('user_info') || sessionStorage.getItem('user_info');
        if (raw) { user = JSON.parse(raw); }
        var code = (user && user.tenantCode) || localStorage.getItem('last_tenant_code');
        if (!code) {
          var h = window.location.hostname.toLowerCase();
          var isIp = /^(\d{1,3}\.){3}\d{1,3}$/.test(h);
          if (h !== 'localhost' && !isIp) {
            var p = h.split('.');
            if (p.length >= 2 && p[0] !== 'www' && p[0] !== 'app' && p[0] !== 'erp') code = p[0];
          }
        }
        var photo = (user && user.profilePhoto) || localStorage.getItem('profilePhoto') || sessionStorage.getItem('profilePhoto');
        var appTitle = code ? code.trim().toUpperCase() : 'SMSERP';
        document.title = appTitle;

        var logoUrl = 'assets/icons/icon-192x192.png';
        if (photo && typeof photo === 'string') {
          var trimmed = photo.trim();
          if (trimmed.startsWith('data:image/') || trimmed.startsWith('http://') || trimmed.startsWith('https://')) {
            logoUrl = trimmed;
          } else {
            var cleanPath = trimmed.startsWith('/') ? trimmed : ('/' + trimmed);
            var apiBase = (typeof window !== 'undefined' && window.__env && window.__env.API_BASE_URL)
              ? window.__env.API_BASE_URL.replace(/\/+$/, '')
              : window.location.origin;
            logoUrl = apiBase + cleanPath;
          }
        }

        var dynamicManifest = {
          name: appTitle,
          short_name: appTitle,
          description: appTitle + " Enterprise ERP Portal",
          start_url: "/",
          scope: "/",
          display: "standalone",
          display_override: ["window-controls-overlay", "standalone", "minimal-ui"],
          background_color: "#ffffff",
          theme_color: "#2563eb",
          orientation: "any",
          lang: "en-IN",
          dir: "ltr",
          categories: ["education", "business", "productivity"],
          icons: [
            {
              src: "/assets/icons/icon-192x192.png",
              sizes: "192x192",
              type: "image/png",
              purpose: "any"
            },
            {
              src: "/assets/icons/icon-512x512.png",
              sizes: "512x512",
              type: "image/png",
              purpose: "any"
            },
            {
              src: "/assets/icons/icon-maskable-192x192.png",
              sizes: "192x192",
              type: "image/png",
              purpose: "maskable"
            },
            {
              src: "/assets/icons/icon-maskable-512x512.png",
              sizes: "512x512",
              type: "image/png",
              purpose: "maskable"
            },
            {
              src: "/__tenant_icon_192.png",
              sizes: "192x192",
              type: "image/png",
              purpose: "any"
            },
            {
              src: "/__tenant_icon_512.png",
              sizes: "512x512",
              type: "image/png",
              purpose: "any"
            }
          ]
        };

        var manifestHref = code ? ('manifest.webmanifest?tenant=' + encodeURIComponent(code.trim().toUpperCase()) + '&t=' + Date.now()) : 'manifest.webmanifest';

        if (typeof window !== 'undefined' && 'caches' in window && code) {
          try {
            caches.open('imserp-dynamic-branding').then(function(c) {
              var mfRes = new Response(JSON.stringify(dynamicManifest, null, 2), {
                headers: {
                  'Content-Type': 'application/manifest+json; charset=utf-8',
                  'Cache-Control': 'no-cache, no-store, must-revalidate'
                }
              });
              c.put('/manifest.webmanifest', mfRes.clone());
              c.put('/' + manifestHref, mfRes.clone());
              c.put('/__tenant_manifest_data__', mfRes.clone());

              if (photo && logoUrl && logoUrl !== 'assets/icons/icon-192x192.png') {
                fetch(logoUrl).then(function(r) {
                  if (r.ok) return r.blob();
                }).then(function(b) {
                  if (b) {
                    var imgRes = new Response(b, {
                      headers: {
                        'Content-Type': 'image/png',
                        'Cache-Control': 'no-cache, no-store, must-revalidate'
                      }
                    });
                    c.put('/__tenant_icon_192.png', imgRes.clone());
                    c.put('/__tenant_icon_512.png', imgRes.clone());
                    c.put('/assets/icons/icon-192x192.png', imgRes.clone());
                    c.put('/assets/icons/icon-512x512.png', imgRes.clone());
                    c.put('/assets/icons/icon-maskable-192x192.png', imgRes.clone());
                    c.put('/assets/icons/icon-maskable-512x512.png', imgRes.clone());
                  }
                }).catch(function() {});
              }
            }).catch(function() {});
          } catch(e) {}
        }

        document.write('<meta id="app-mobile-title" name="apple-mobile-web-app-title" content="' + appTitle + '">');
        document.write('<meta id="app-application-name" name="application-name" content="' + appTitle + '">');
        document.write('<link id="app-manifest" rel="manifest" href="' + manifestHref + '">');
        document.write('<link id="app-apple-touch-icon" rel="apple-touch-icon" href="' + logoUrl + '">');
        document.write('<link id="app-apple-touch-icon-precomposed" rel="apple-touch-icon-precomposed" href="' + logoUrl + '">');

        if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js').then(function(r) { r.update(); }).catch(function() {});
        }
      } catch(e) {
        document.write('<link id="app-manifest" rel="manifest" href="manifest.webmanifest">');
      }
    })();
  </script>

  <script>
    // Safeguard against third-party translation script errors (e.g. Google Translate reading 'link')
    window.addEventListener('error', function(e) {
      if (e && e.message && (e.message.indexOf('link') !== -1 || e.message.indexOf('reading') !== -1)) {
        if (!e.filename || e.filename.indexOf('translate') !== -1 || e.filename.indexOf('m=el_main') !== -1 || e.filename.indexOf('element.js') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }
    }, true);

    // Ensure clean boot according to chosen ERP language
    (function() {
      try {
        var savedLang = localStorage.getItem('imserp_lang');
        if (!savedLang && document.cookie.indexOf('googtrans=/en/hi') !== -1) {
          savedLang = 'hi';
          localStorage.setItem('imserp_lang', 'hi');
        }
        var hostname = window.location.hostname;
        var parts = hostname.split('.');
        var domains = ['', hostname, '.' + hostname];
        if (parts.length > 2) {
          var rootDomain = parts.slice(-2).join('.');
          domains.push(rootDomain, '.' + rootDomain);
        }
        var paths = ['/', ''];

        if (savedLang === 'hi') {
          document.documentElement.setAttribute('lang', 'hi');
          var exp = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toUTCString();
          document.cookie = 'googtrans=/en/hi; expires=' + exp + '; path=/;';
          if (hostname && hostname !== 'localhost') {
            document.cookie = 'googtrans=/en/hi; expires=' + exp + '; path=/; domain=.' + hostname + ';';
            document.cookie = 'googtrans=/en/hi; expires=' + exp + '; path=/; domain=' + hostname + ';';
            if (parts.length > 2) {
              var rd = parts.slice(-2).join('.');
              document.cookie = 'googtrans=/en/hi; expires=' + exp + '; path=/; domain=.' + rd + ';';
              document.cookie = 'googtrans=/en/hi; expires=' + exp + '; path=/; domain=' + rd + ';';
            }
          }
        } else {
          document.documentElement.setAttribute('lang', 'en');
          var past = 'Thu, 01 Jan 1970 00:00:00 GMT; max-age=0;';
          var names = ['googtrans', '_googtrans', 'googtrans_en'];
          domains.forEach(function(d) {
            paths.forEach(function(p) {
              names.forEach(function(name) {
                var s = name + '=; expires=' + past;
                if (p) s += ' path=' + p + ';';
                if (d) s += ' domain=' + d + ';';
                document.cookie = s;
              });
            });
          });
        }
      } catch(e) {}
    })();
  </script>

<body class="mat-typography mat-app-background">
  <app-root></app-root>
  <div id="google_translate_element" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;"></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      try {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'hi,en',
            autoDisplay: false
          }, 'google_translate_element');
        }
      } catch (e) {}
    }

    function ensureGoogleTranslateScript() {
      try {
        if (document.getElementById('google-translate-script')) return;
        var s = document.createElement('script');
        s.id = 'google-translate-script';
        s.type = 'text/javascript';
        s.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
        s.async = true;
        document.body.appendChild(s);
      } catch (e) {}
    }

    (function() {
      try {
        var savedLang = localStorage.getItem('imserp_lang');
        if (!savedLang && document.cookie.indexOf('googtrans=/en/hi') !== -1) {
          savedLang = 'hi';
        }
        if (savedLang === 'hi') {
          ensureGoogleTranslateScript();
        }
      } catch (e) {}
    })();
  </script>
